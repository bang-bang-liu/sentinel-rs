[package]
name = "sentinel-relogin"
version = "0.1.0"
edition = "2021"

[dependencies]
sentinel-rs = { path = "../../.." }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "signal", "rt-multi-thread", "macros", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wreq = { version = "=0.16.1", features = ["socks"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
